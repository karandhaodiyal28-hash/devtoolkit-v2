[build-system]
requires = [
    "setuptools>=84.2.1; python_version >= '3.10'",
    "setuptools>=68,<84; python_version < '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "devtoolkit"
version = "0.4.0"
description = "Small dependency-free helpers for everyday developer scripting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Karan Dhaodiyal", email = "karandhaodiyal28-hash@users.noreply.github.com" }]
keywords = ["utils", "cli", "developer-tools"]

[project.urls]
Homepage = "https://github.com/karandhaodiyal28-hash/devtoolkit"
Repository = "https://github.com/karandhaodiyal28-hash/devtoolkit"

[project.scripts]
devtoolkit = "devtoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devtoolkit = ["py.typed"]
