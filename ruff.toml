line-length = 100
target-version = "py39"
src = ["src", "tests"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default argument is fine here
    "RUF012", # class attributes are annotated at runtime on purpose
]

[lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are the point of a test suite
