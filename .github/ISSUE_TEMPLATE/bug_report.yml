name: Bug report
description: Report something that behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please fill in the details below.

  - type: input
    id: what-happened
    attributes:
      label: What happened?
      description: A short description of the issue
      placeholder: truncate() returns one character too many
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can someone else see the same behaviour?
      placeholder: |
        1. pip install -e .
        2. Call truncate("a very long sentence", 10)
        3. The result is longer than 10 characters
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: devtoolkit version
      placeholder: 0.3.0

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: 3.12.0

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
